name: Build and publish npm package
run-name: Publish ${{ inputs.major_version }}.${{ inputs.build_number }} (${{ inputs.build_type }})

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: npm release channel
        type: choice
        options: [Nightly, Stage, Beta, Release]
        required: true
      build_number:
        description: Jenkins build number used in the package version
        type: string
        required: true
      major_version:
        description: Version prefix (MAJOR.MINOR, or + with ONGOING_MAJOR_VERSION)
        type: string
        required: true
      source_sha:
        description: Package commit from Jenkins (defaults to the selected GitHub ref)
        type: string
      wrappers_ref:
        description: Commit or branch in the wrappers mirror
        type: string
        default: master
      build_options:
        description: JSON overrides for native versions, variants, dependencies and tests
        type: string
        default: '{}'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          path: build
          persist-credentials: false

      - name: Checkout wrapper build scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ vars.WRAPPERS_MIRROR_REPOSITORY || 'regulaforensics/gitlab_mobile-sdk_wrappers' }}
          ref: ${{ inputs.wrappers_ref }}
          token: ${{ secrets.REGULA_BOT_TOKEN }}
          path: wrappers
          sparse-checkout: .hidden/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.22.3'
          package-manager-cache: false

      - name: Set up build options
        env:
          INPUT_BUILD_TYPE: ${{ inputs.build_type }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          INPUT_MAJOR_VERSION: ${{ inputs.major_version }}
          INPUT_BUILD_OPTIONS: ${{ inputs.build_options }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git -C build rev-parse HEAD)" = "$SOURCE_SHA"
          node wrappers/.hidden/scripts/npm-actions.mjs
          npm install --global npm@11 typedoc

      - name: Build wrapper
        id: build
        working-directory: build
        env:
          LOCAL_BUILD: 'false'
          NPM_BUILD_ONLY: 'true'
        run: |
          if [ "$ANDROID_VERSION" = '+' ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libxml2-utils
          fi
          bash ./update.sh
          rm -f ../.used-build-folder
          if [ -d examples ]; then
            echo 'has_examples=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Package example sources for Jenkins
        if: steps.build.outputs.has_examples == 'true'
        run: |
          jq -cn --arg source_sha "$(git -C build rev-parse HEAD)" \
            --arg wrappers_sha "$(git -C wrappers rev-parse HEAD)" --arg build_type "$TYPE" \
            --arg version "$(jq -r .version build/package.json)" \
            '{source_sha: $source_sha, wrappers_sha: $wrappers_sha, build_type: $build_type, version: $version}' > npm-example.json
          tar --exclude=build/.git --exclude=build/.github -czf npm-example.tar.gz npm-example.json build

      - name: Upload example sources
        if: steps.build.outputs.has_examples == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-example
          path: npm-example.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish using npm Trusted Publishing
        working-directory: build
        run: |
          npm pkg set "repository.url=git+https://github.com/${GITHUB_REPOSITORY}.git"
          npm publish --access public --tag "$NPM_DIST_TAG" --registry https://registry.npmjs.org
          source ../wrappers/.hidden/scripts/npm.sh
          waitForNpm "$(jq -r .name package.json)" "$(jq -r .version package.json)"
